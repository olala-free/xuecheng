<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee2">
  <title>工科知识图谱 · 高数 / 线代 / 概率 / 大物 / 材料</title>
  <style>
:root {
  --topbar-h: 72px;
  --sidebar-w: 286px;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STZhongsong", "SimSun", serif;
  --sans: "Inter", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  --paper: #f3eee2;
  --paper-2: #ebe4d4;
  --surface: #fffaf0;
  --surface-2: #f8f2e6;
  --ink: #22261f;
  --ink-2: #4e5348;
  --muted: #85857a;
  --line: rgba(38, 42, 34, 0.13);
  --line-strong: rgba(38, 42, 34, 0.24);
  --dot: rgba(38, 42, 34, 0.10);
  --shadow: 0 12px 34px rgba(58, 48, 28, 0.09);
  --shadow-deep: 0 24px 70px rgba(40, 32, 18, 0.18);
  --accent: #b23a2b;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 38%, transparent);
  --accent-ink: color-mix(in srgb, var(--accent) 72%, #1d1d18);
  --root-bg: #242820;
  --root-ink: #f6f0e2;
  --code-bg: color-mix(in srgb, var(--accent) 9%, var(--surface));
}

[data-theme="dark"] {
  --paper: #141713;
  --paper-2: #191d18;
  --surface: #1f241e;
  --surface-2: #242a23;
  --ink: #eee9dc;
  --ink-2: #c3c1b4;
  --muted: #96988b;
  --line: rgba(240, 235, 220, 0.13);
  --line-strong: rgba(240, 235, 220, 0.24);
  --dot: rgba(240, 235, 220, 0.09);
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
  --shadow-deep: 0 24px 70px rgba(0, 0, 0, 0.52);
  --root-bg: #ede7d8;
  --root-ink: #20241e;
  --accent-ink: color-mix(in srgb, var(--accent) 55%, #f3eee2);
  --code-bg: color-mix(in srgb, var(--accent) 16%, var(--surface));
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input { font: inherit; color: inherit; }
button { border: 0; background: none; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

::selection { background: var(--accent-soft); color: var(--ink); }

/* ---------- shell ---------- */

#app {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: var(--topbar-h) minmax(0, 1fr);
  background:
    radial-gradient(1200px 500px at 80% -10%, var(--accent-soft), transparent 60%),
    var(--paper);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 88%, var(--surface));
  position: relative;
  z-index: 60;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 218px;
}

.brand-seal {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--serif);
  font-size: 19px;
  border-radius: 4px;
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--paper) 16%, transparent);
}

.brand h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.06em;
  line-height: 1.2;
}

.brand p {
  margin: 3px 0 0;
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.12em;
}

.course-tabs {
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.course-tabs::-webkit-scrollbar { display: none; }

.tab {
  --accent: #b23a2b;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border-radius: 7px;
  color: var(--muted);
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease;
}

.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 7%, transparent); }

.tab-mark {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--accent);
  width: 16px;
  text-align: center;
  opacity: 0.85;
}

.tab-name { font-size: 12.5px; letter-spacing: 0.03em; }

.tab.active {
  color: var(--ink);
  background: color-mix(in srgb, var(--accent) 11%, transparent);
  box-shadow: inset 0 -2px 0 var(--accent);
}

.tab.active .tab-name { font-weight: 600; }

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 258px;
  height: 36px;
  padding: 0 9px 0 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
  transition: border-color 0.18s ease, box-shadow 0.18s ease, width 0.2s ease;
}

.search:focus-within {
  width: 300px;
  border-color: var(--accent-line);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.search svg { flex: 0 0 auto; opacity: 0.55; }

.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: none;
  font-size: 12px;
  letter-spacing: 0.01em;
}
.search input::placeholder { color: var(--muted); }

.search kbd, kbd {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1px 4px;
  background: var(--surface);
}

.icon-btn {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 60%, transparent);
  color: var(--ink-2);
  transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
}
.icon-btn:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.icon-btn svg { width: 16px; height: 16px; }
#menuBtn { display: none; }

/* ---------- layout ---------- */

.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 0;
}

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--surface) 58%, transparent), transparent 34%),
    color-mix(in srgb, var(--paper-2) 56%, var(--paper));
  position: relative;
  z-index: 30;
}

.course-head {
  padding: 20px 20px 14px;
  border-bottom: 1px solid var(--line);
}

.course-head-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.course-mark {
  width: 46px;
  height: 46px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 1px solid var(--accent-line);
  border-radius: 50%;
  color: var(--accent);
  font-family: var(--serif);
  font-size: 24px;
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--surface) 55%, transparent);
}

.course-edition {
  margin: 1px 0 3px;
  color: var(--accent);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.course-head h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1.25;
  letter-spacing: 0.02em;
}

.course-intro {
  margin: 13px 0 0;
  color: var(--ink-2);
  font-size: 11.5px;
  line-height: 1.75;
  letter-spacing: 0.01em;
}

.side-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 12px 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.side-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 7px;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.16em;
}

.all-chapters {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 9px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 11.5px;
  transition: background 0.16s ease, color 0.16s ease;
}
.all-chapters:hover { color: var(--ink); background: var(--accent-soft); }
.all-chapters.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.chapter-btn {
  position: relative;
  width: 100%;
  display: grid;
  grid-template-columns: 25px minmax(0, 1fr) auto;
  align-items: center;
  gap: 7px;
  padding: 8px 9px 7px;
  border-radius: 8px;
  text-align: left;
  color: var(--ink-2);
  transition: background 0.16s ease, color 0.16s ease;
}

.chapter-btn:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); color: var(--ink); }

.chapter-btn.active {
  background: var(--accent-soft);
  color: var(--ink);
  box-shadow: inset 2px 0 0 var(--accent);
}

.ch-no {
  font-family: var(--serif);
  font-size: 11px;
  color: var(--accent);
  opacity: 0.8;
}

.ch-title {
  font-size: 11.5px;
  line-height: 1.35;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
}

.ch-count { font-size: 9px; color: var(--muted); font-family: var(--mono); }

.ch-bar {
  grid-column: 2 / 4;
  height: 2px;
  margin-top: 2px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
}
.ch-bar i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.35s ease;
}

.side-foot {
  flex: 0 0 auto;
  padding: 13px 20px 17px;
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 34%, transparent);
}

.progress-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  margin-bottom: 7px;
}
.progress-label b { color: var(--ink); font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0; }

.progress-bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }

/* ---------- stage ---------- */

.stage {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.stage-toolbar {
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 80%, var(--surface));
  position: relative;
  z-index: 25;
}

.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-size: 11.5px;
  color: var(--muted);
}
.crumbs b { color: var(--ink); font-weight: 600; }
.crumbs button { color: var(--muted); padding: 2px 0; border-bottom: 1px solid transparent; }
.crumbs button:hover { color: var(--accent); border-color: var(--accent-line); }
.crumbs .slash { opacity: 0.4; }
.crumb-sub { color: var(--muted); white-space: nowrap; }

.tools {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
}

.seg {
  display: flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  overflow: hidden;
  background: var(--surface);
}
.seg button {
  padding: 5px 10px;
  font-size: 10.5px;
  color: var(--muted);
  border-right: 1px solid var(--line);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--accent); background: var(--accent-soft); }
.seg button.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

.tool-sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }

.zoom-label {
  min-width: 36px;
  text-align: center;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--muted);
}

.fit-btn {
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 10.5px;
  color: var(--ink-2);
  background: var(--surface);
}
.fit-btn:hover { color: var(--accent); border-color: var(--accent-line); }

.viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 1.1px 1.1px, var(--dot) 1.1px, transparent 0),
    radial-gradient(1200px 720px at 50% 30%, color-mix(in srgb, var(--surface) 60%, transparent), transparent 70%);
  background-size: 26px 26px, 100% 100%;
}
.viewport.panning { cursor: grabbing; }
.viewport::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 80px color-mix(in srgb, var(--paper-2) 55%, transparent);
}

.watermark {
  position: absolute;
  right: -10px;
  bottom: -92px;
  font-family: var(--serif);
  font-size: 380px;
  line-height: 1;
  color: var(--accent);
  opacity: 0.035;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

#world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
  z-index: 2;
}

#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#nodes { position: absolute; left: 0; top: 0; }

.link {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 1.15;
  stroke-linecap: round;
  transition: opacity 0.2s ease, stroke 0.2s ease;
}
.link.d1 { stroke: color-mix(in srgb, var(--accent) 30%, var(--line-strong)); }
.link.d2 { stroke: color-mix(in srgb, var(--accent) 24%, var(--line-strong)); }
.link.active { stroke: var(--accent); stroke-width: 1.9; opacity: 0.95; }
.link.hidden { opacity: 0; }

/* ---------- nodes ---------- */

.node {
  position: absolute;
  left: 0;
  top: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 10px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent), var(--shadow);
  transform-origin: 0 0;
  will-change: transform, opacity;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.node:hover {
  border-color: var(--accent-line);
  box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent), 0 10px 28px color-mix(in srgb, var(--accent) 13%, transparent);
}
.node:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 4%, transparent), 0 4px 12px color-mix(in srgb, var(--accent) 10%, transparent); }

.node.root {
  width: 200px;
  height: 150px;
  padding: 15px 16px 13px;
  justify-content: space-between;
  border: 0;
  border-radius: 14px;
  background:
    radial-gradient(180px 110px at 110% -10%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 70%),
    var(--root-bg);
  color: var(--root-ink);
  box-shadow: 0 18px 44px color-mix(in srgb, var(--root-bg) 30%, transparent);
}
.root-mark { font-family: var(--serif); font-size: 30px; line-height: 0.9; color: var(--accent); }
.root-name { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: 0.03em; line-height: 1.25; }
.root-edition { font-size: 9px; letter-spacing: 0.1em; opacity: 0.58; margin-top: 2px; }
.root-stats {
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid color-mix(in srgb, var(--root-ink) 18%, transparent);
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.03em;
  opacity: 0.7;
}

.node.chapter {
  width: 216px;
  height: 68px;
  padding: 9px 12px 8px;
  gap: 3px;
  background: color-mix(in srgb, var(--surface) 94%, var(--paper));
}
.node.chapter::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 2px;
  border-radius: 0 2px 2px 0;
  background: var(--accent);
  opacity: 0.75;
}
.ch-line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.ch-no {
  font-family: var(--serif);
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 0.04em;
  flex: 0 0 auto;
}
.ch-name {
  font-family: var(--serif);
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: 0.01em;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.ch-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 8.5px;
  font-family: var(--mono);
  letter-spacing: 0.02em;
}
.ch-meta .chev { font-family: var(--sans); font-size: 13px; line-height: 1; transition: transform 0.25s ease; }
.node.chapter.expanded .chev { transform: rotate(90deg); }
.node.chapter.left-branch:not(.expanded) .chev { transform: rotate(180deg); }
.node.chapter.left-branch { text-align: right; }
.node.chapter.left-branch::before { left: auto; right: 0; border-radius: 2px 0 0 2px; }
.node.chapter.left-branch .ch-line { justify-content: flex-end; }
.node.chapter.left-branch .ch-meta { flex-direction: row-reverse; }

.node.section {
  width: 200px;
  height: 48px;
  padding: 6px 9px 6px 10px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 6px;
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--ink) 5%, transparent);
}
.sec-no {
  font-family: var(--mono);
  font-size: 8.5px;
  color: var(--accent);
  opacity: 0.8;
  padding: 2px 4px;
  border-radius: 3px;
  background: var(--accent-soft);
}
.sec-name {
  font-size: 11px;
  line-height: 1.35;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.sec-count {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--muted);
  padding: 1px 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
.node .chev { color: var(--muted); font-size: 12px; line-height: 1; transition: transform 0.25s ease; }
.node.section.expanded .chev { transform: rotate(90deg); }
.node.leaf .chev { display: none; }

.node.point {
  width: 254px;
  height: 44px;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-radius: 22px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  box-shadow: 0 4px 12px color-mix(in srgb, var(--ink) 4%, transparent);
}
.pt-dot {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: transparent;
}
.pt-name {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  line-height: 1.35;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.pt-tick {
  flex: 0 0 auto;
  font-size: 9px;
  color: var(--accent);
  opacity: 0;
  transform: scale(0.6);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.node.point.mastered .pt-tick { opacity: 1; transform: scale(1); }
.node.point.mastered .pt-dot { background: var(--accent); border-color: var(--accent); }
.node.point.mastered .pt-name { color: var(--muted); }

.node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 12px 30px color-mix(in srgb, var(--accent) 18%, transparent); }
.node.point.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.node.point.selected .pt-name { color: #fff; font-weight: 600; }
.node.point.selected .pt-dot { border-color: #fff; background: #fff; }
.node.point.selected .pt-tick { color: #fff; }
.node.chapter.selected .ch-name, .node.section.selected .sec-name { color: var(--accent); }

.node.dim { opacity: 0.16; filter: saturate(0.35); pointer-events: none; }
.node.kin { opacity: 0.55; }
.node.match {
  border-color: var(--accent);

  opacity: 1;
  filter: none;
}
.node.match .pt-name, .node.match .sec-name, .node.match .ch-name { color: var(--accent); font-weight: 700; }

/* ---------- detail ---------- */

.detail {
  position: absolute;
  z-index: 24;
  top: 16px;
  right: 16px;
  width: 376px;
  max-height: calc(100% - 32px);
  overflow-y: auto;
  padding: 20px 20px 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow-deep);
  animation: detailIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
.detail::before {
  content: "";
  position: absolute;
  left: 20px;
  right: 20px;
  top: 0;
  height: 2px;
  background: var(--accent);
  border-radius: 0 0 2px 2px;
}
.detail[hidden] { display: none; }

@keyframes detailIn {
  from { opacity: 0; transform: translateY(8px) scale(0.99); }
  to { opacity: 1; transform: none; }
}

.detail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.detail-eyebrow {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
}
.detail-close {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted);
  font-size: 17px;
  line-height: 1;
}
.detail-close:hover { color: var(--ink); background: var(--accent-soft); }

.detail-title {
  margin: 8px 0 4px;
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.32;
  letter-spacing: 0.01em;
  font-weight: 700;
}
.detail-path {
  margin: 0;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.03em;
}
.detail-quote {
  margin: 11px 0 0;
  padding: 0 0 0 12px;
  border-left: 2px solid var(--accent-line);
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.7;
  letter-spacing: 0.01em;
}
.detail-quote code, .detail-body code {
  font-family: var(--mono);
  font-size: 0.9em;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--code-bg);
  color: var(--accent-ink);
  overflow-wrap: anywhere;
}

.kp-sections {
  margin-top: 13px;
  display: flex;
  flex-direction: column;
  gap: 13px;
}
.kp-block {
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.kp-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8.5px;
  font-weight: 600;
  letter-spacing: 0.14em;
}
.kp-label span {
  color: var(--muted);
  font-weight: 400;
  opacity: 0.7;
}
.kp-text {
  margin: 5px 0 0;
  color: var(--ink-2);
  font-size: 12px;
  line-height: 1.72;
}
.kp-text code, .kp-notes code, .kp-symbols code {
  font-family: var(--mono);
  font-size: 0.9em;
  padding: 1px 3px;
  border-radius: 3px;
  background: var(--code-bg);
  color: var(--accent-ink);
}
.kp-formula {
  margin-top: 8px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent-line);
  border-radius: 0 6px 6px 0;
  background: var(--code-bg);
  overflow-x: auto;
  scrollbar-width: thin;
}
.formula-line {
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.95;
  color: var(--ink);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.formula-line + .formula-line { margin-top: 2px; }
.kp-symbols {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 4px 11px;
  margin: 6px 0 0;
}
.kp-symbols dt {
  align-self: start;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: var(--accent-ink);
  font-family: var(--mono);
  font-size: 9.5px;
  line-height: 1.6;
  max-width: 150px;
  white-space: normal;
  overflow-wrap: anywhere;
}
.kp-symbols dd {
  margin: 0;
  color: var(--ink-2);
  font-size: 10.5px;
  line-height: 1.7;
}
.kp-notes {
  margin: 8px 0 0;
  padding-left: 15px;
}
.kp-notes li {
  margin: 0 0 4px;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.75;
}
.kp-notes li::marker { color: var(--accent); }

.detail-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  margin: 11px 0 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--line);
}
.detail-stats div { background: var(--surface); padding: 6px 9px; }
.detail-stats b {
  display: block;
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.detail-stats span { font-size: 8.5px; color: var(--muted); letter-spacing: 0.08em; }

.detail-list { margin-top: 15px; display: flex; flex-direction: column; gap: 1px; }
.detail-list-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 7px;
  color: var(--muted);
  font-size: 8.5px;
  letter-spacing: 0.12em;
}
.detail-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 7px 6px;
  border-radius: 6px;
  text-align: left;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.5;
}
.detail-item:hover { background: var(--accent-soft); color: var(--ink); }
.detail-item .di-no { font-family: var(--mono); font-size: 8.5px; color: var(--accent); opacity: 0.8; flex: 0 0 auto; }
.detail-item .di-name { flex: 1; }
.detail-item .di-count { font-family: var(--mono); font-size: 8px; color: var(--muted); }
.detail-item.is-mastered .di-name { color: var(--muted); }

.detail-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 15px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.master-btn, .ghost-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 11px;
  border-radius: 7px;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
}
.master-btn {
  flex: 1;
  border: 1px solid var(--accent-line);
  color: var(--accent);
  background: var(--accent-soft);
}
.master-btn:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.master-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.master-btn kbd { color: currentColor; border-color: currentColor; opacity: 0.45; background: transparent; }
.ghost-btn { border: 1px solid var(--line); color: var(--muted); }
.ghost-btn:hover { color: var(--accent); border-color: var(--accent-line); }

.detail-nav {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.detail-nav button {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-size: 9.5px;
}
.detail-nav button:hover { color: var(--accent); border-color: var(--accent-line); }

.detail-hint {
  margin-top: 15px;
  padding: 10px 11px;
  border: 1px dashed var(--line-strong);
  border-radius: 7px;
  color: var(--muted);
  font-size: 9.5px;
  line-height: 1.7;
}

/* ---------- search results ---------- */

.search-panel {
  position: absolute;
  z-index: 26;
  top: 12px;
  left: 16px;
  width: 344px;
  max-width: calc(100% - 32px);
  max-height: 64%;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: color-mix(in srgb, var(--surface) 96%, transparent);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow-deep);
  padding: 10px;
  animation: detailIn 0.22s ease;
  scrollbar-width: thin;
}
.search-panel[hidden] { display: none; }
.search-summary {
  display: flex;
  justify-content: space-between;
  padding: 3px 6px 8px;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.search-result {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 7px;
  border-radius: 7px;
  border-left: 2px solid transparent;
}
.search-result:hover { background: var(--accent-soft); border-left-color: var(--accent); }
.sr-title { display: flex; align-items: baseline; gap: 7px; font-size: 11.5px; }
.sr-type {
  font-family: var(--mono);
  font-size: 7.5px;
  color: var(--accent);
  border: 1px solid var(--accent-line);
  border-radius: 3px;
  padding: 0 3px;
  flex: 0 0 auto;
}
.sr-path { margin-top: 3px; color: var(--muted); font-size: 8.5px; letter-spacing: 0.02em; }
.search-empty { padding: 18px 10px; text-align: center; color: var(--muted); font-size: 11px; line-height: 1.8; }

/* ---------- overlays ---------- */

.legend {
  position: absolute;
  left: 18px;
  bottom: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  backdrop-filter: blur(8px);
  color: var(--muted);
  font-size: 8.5px;
  letter-spacing: 0.04em;
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.legend .l-ch { background: var(--accent); }
.legend .l-sec { background: color-mix(in srgb, var(--accent) 55%, var(--muted)); }
.legend .l-pt { border: 1px solid var(--accent); }

.zoom-pill {
  position: absolute;
  right: 18px;
  bottom: 16px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  backdrop-filter: blur(8px);
  box-shadow: var(--shadow);
}
.zoom-pill button {
  width: 26px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 5px;
  color: var(--muted);
  font-size: 14px;
}
.zoom-pill button:hover { color: var(--accent); background: var(--accent-soft); }

.hint {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 9;
  padding: 5px 12px;
  border-radius: 20px;
  background: color-mix(in srgb, var(--ink) 82%, transparent);
  color: var(--paper);
  font-size: 8.5px;
  letter-spacing: 0.05em;
  opacity: 0.72;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
.hint.gone { opacity: 0; }

/* ---------- responsive ---------- */

@media (max-width: 1180px) {
  :root { --sidebar-w: 252px; }
  .brand { min-width: 176px; }
  .brand p { display: none; }
  .search { width: 208px; }
  .search:focus-within { width: 236px; }
  .tab { padding: 7px 8px; }
}

@media (max-width: 980px) {
  :root { --sidebar-w: 0px; --topbar-h: 64px; }
  .brand { min-width: 0; }
  .brand h1 { font-size: 15px; }
  .brand-seal { width: 31px; height: 31px; font-size: 16px; }
  .course-tabs { flex: 1; }
  .tab-name { display: none; }
  .tab { padding: 8px 9px; }
  .tab-mark { font-size: 15px; }
  .search { width: 36px; padding: 0 9px; }
  .search:focus-within { width: min(250px, 42vw); }
  .search input { display: none; }
  .search:focus-within input { display: block; }
  .search kbd { display: none; }
  #menuBtn { display: grid; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    top: var(--topbar-h);
    bottom: 0;
    left: 0;
    width: 286px;
    transform: translateX(-102%);
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: var(--shadow-deep);
  }
  body.sidebar-open .sidebar { transform: none; }
  .stage-toolbar { padding: 0 12px; gap: 8px; }
  .crumb-sub { display: none; }
  .seg button { padding: 5px 7px; }
  .detail { left: 12px; right: 12px; bottom: 12px; top: auto; width: auto; max-height: 62%; }
  .detail::before { left: 16px; right: 16px; }
  .legend { display: none; }
  .watermark { font-size: 280px; bottom: -60px; }
  .hint { display: none; }
}

@media (max-width: 640px) {
  .top-actions { gap: 5px; }
  .brand h1 { display: none; }
  .stage-toolbar { flex-wrap: nowrap; }
  .crumbs { font-size: 10.5px; overflow: hidden; white-space: nowrap; }
  .tools { gap: 4px; }
  .tool-sep, .zoom-label, .fit-btn { display: none; }
  .seg button { font-size: 10px; }
  .zoom-pill { right: 12px; bottom: 12px; }
  .search:focus-within { width: 48vw; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

  <script>
(window.COURSES = window.COURSES || []).push({
  "id": "gaoshu",
  "name": "高等数学",
  "short": "高数",
  "edition": "同济版 · 上下册",
  "mark": "∫",
  "color": "#b23a2b",
  "intro": "以极限为起点，研究一元与多元微积分、级数与微分方程，是工科后续课程的数学底座。",
  "chapters": [
    {
      "t": "函数与极限",
      "intro": "极限是微积分的语言；连续是极限的直接推论。先会算极限，再谈连续。",
      "secs": [
        {
          "t": "映射与函数",
          "pts": [
            {
              "t": "函数三要素",
              "intro": "定义域、对应法则、值域；两函数相同 ⇔ 定义域与对应法则都相同。",
              "def": "函数是定义域 D 到实数集的单值对应：每个 x 按法则 f 对应唯一的 y。三要素中定义域与对应法则决定函数本身，值域是二者作用的结果。",
              "formula": [
                "y=f(x)，x∈D"
              ],
              "symbols": [
                [
                  "x",
                  "自变量；取遍定义域 D"
                ],
                [
                  "y",
                  "因变量；由 x 与法则 f 唯一确定"
                ],
                [
                  "f",
                  "对应法则；把 x 映为 y"
                ],
                [
                  "D",
                  "定义域；使 f 有意义的 x 的集合"
                ]
              ],
              "notes": [
                "求定义域按分母≠0、偶次根号内≥0、对数真数>0、arcsin/arccos 内 |·|≤1 逐条限制取交集。",
                "两函数相同只看定义域与对应法则，与自变量字母无关：f(x)=x² 与 g(t)=t² 是同一函数。",
                "值域不必单独求，它由定义域与法则决定，考试中很少作为判定条件。"
              ]
            },
            {
              "t": "函数的四性",
              "intro": "有界、单调、奇偶、周期；判断奇偶先看定义域是否关于原点对称。",
              "def": "有界、单调、奇偶、周期是函数在区间上的四种整体性质，分别对应对值域的限制、序关系、对称性与重复性。",
              "formula": [
                "有界：∃M>0，|f(x)|≤M（x∈D）",
                "奇：f(−x)=−f(x)；偶：f(−x)=f(x)"
              ],
              "symbols": [
                [
                  "M",
                  "正数上界；与 x 无关"
                ],
                [
                  "f",
                  "被考察的函数"
                ],
                [
                  "x",
                  "自变量"
                ],
                [
                  "D",
                  "定义域"
                ]
              ],
